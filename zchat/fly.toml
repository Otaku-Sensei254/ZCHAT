# fly.toml app configuration file
app = "zchat2-0"
primary_region = "ord"

[build]

[env]
  PHX_HOST = "zchat2-0.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[deploy]
  release_command = "/app/bin/migrate"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1